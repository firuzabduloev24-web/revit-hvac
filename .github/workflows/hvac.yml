name: 24/7 Revit HVAC Bot Server

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-hvac-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.11 ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI

      - name: HVAC Botni ishga tushirish
        run: |
          python bot.py
